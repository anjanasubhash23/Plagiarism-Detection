[project]
name = "hindi-plag"
version = "0.1.0"
description = "Layered plagiarism detection for Hindi text, with an evaluation benchmark."
readme = "README.md"
requires-python = ">=3.11"
# No runtime dependencies yet: Phase 1 reads .docx with the standard library.
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
